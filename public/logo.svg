<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="logoShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="logoPlayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="textProGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON SECTION -->
  <g transform="translate(4, 0)">
    <!-- Outer Ambient Glow -->
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="#F59E0B" opacity="0.25" filter="url(#logoGlow)" />

    <!-- Shield Base Background -->
    <polygon points="32,6 56,19 56,45 32,58 8,45 8,19" fill="url(#logoShieldGrad)" stroke="url(#logoGoldGrad)" stroke-width="3" stroke-linejoin="round" />

    <!-- Tech Coin Orbit -->
    <circle cx="32" cy="32" r="18" stroke="#334155" stroke-width="1.8" />
    <circle cx="32" cy="32" r="18" stroke="#F59E0B" stroke-width="2.2" stroke-dasharray="7 5" stroke-linecap="round" opacity="0.85" />

    <!-- Play Symbol (Watch) -->
    <polygon points="27,23 41,32 27,41" fill="url(#logoPlayGrad)" />
    <polygon points="28,26 38,32 28,38" fill="#FEF08A" opacity="0.75" />

    <!-- Spark Star (Earn) -->
    <circle cx="44" cy="18" r="3.5" fill="#10B981" />
    <path d="M44,13 L45,17 L49,18 L45,19 L44,23 L43,19 L39,18 L43,17 Z" fill="#34D399" />
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g transform="translate(76, 0)">
    <!-- "AdEarn" in bold clean modern typeface -->
    <text x="0" y="37" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">AdEarn</text>
    
    <!-- "Pro" with Vibrant Gradient Badge -->
    <text x="100" y="37" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="url(#textProGrad)" letter-spacing="-0.5">Pro</text>
    
    <!-- Subtitle Tagline -->
    <text x="1" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#94A3B8" letter-spacing="2.2">WATCH • COMPLETE • EARN</text>
  </g>
</svg>
